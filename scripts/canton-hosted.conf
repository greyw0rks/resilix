# Resilix — Canton config for the hosted sandbox.
#
# There is exactly one reason this file exists: `address`.
#
# The sandbox's HTTP JSON Ledger API binds 127.0.0.1 by default, and `daml
# sandbox` has no --address flag to change that (`daml sandbox --help` lists
# --port and friends, nothing for the bind address). On a dev machine that
# default is invisible, because the app runs on the same host. In a hosted
# deployment it is fatal: the platform's edge proxy reaches the container over
# its network interface, so a loopback-only listener is unreachable from the
# public internet and every request from the deployed site fails to connect.
#
# Measured rather than assumed. The same sandbox launched with CLI flags alone
# reports `LISTEN [::ffff:127.0.0.1]:7575` and refuses a request to the host's
# own non-loopback address; with this file it reports `LISTEN *:7575` and
# answers 200 from that same non-loopback address.
#
# Only the JSON API is opened up. The five gRPC ports (ledger, admin,
# sequencer public/admin, mediator admin) stay on loopback: they are internal to
# the process, and scripts/ledger-host.sh binds them to a private block.
#
# `sandbox` is the participant node's name in `daml sandbox` — the same name
# that appears as `participant=sandbox` in its logs.

canton.participants.sandbox.http-ledger-api.address = "0.0.0.0"
