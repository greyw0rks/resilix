name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  daml:
    name: Daml contracts (build + acceptance tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Daml SDK
        uses: actions/cache@v4
        with:
          path: ~/.daml
          key: daml-sdk-3.5.0-snapshot.20260403.0

      - name: Install Daml SDK 3.5.0-snapshot.20260403.0
        run: |
          if [ ! -x "$HOME/.daml/bin/daml" ]; then
            curl -sSL https://get.daml.com | sh -s 3.5.0-snapshot.20260403.0
          fi
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"

      - name: daml build
        working-directory: daml
        run: daml build

      - name: daml test (threshold-workflow acceptance suite)
        working-directory: daml
        run: daml test

  web:
    name: Next app (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  ledger:
    name: LocalNet (bring-up + on-ledger invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Daml SDK
        uses: actions/cache@v4
        with:
          path: ~/.daml
          key: daml-sdk-3.5.0-snapshot.20260403.0

      - name: Install Daml SDK 3.5.0-snapshot.20260403.0
        run: |
          if [ ! -x "$HOME/.daml/bin/daml" ]; then
            curl -sSL https://get.daml.com | sh -s 3.5.0-snapshot.20260403.0
          fi
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # Proves the reproducible setup path end to end: one command brings up a
      # real Canton sandbox and initializes it, the next asserts the control
      # layer's invariants on that ledger.
      - name: Bring up LocalNet
        run: npm run ledger:up

      - name: Verify the on-ledger invariants
        run: npm run verify:ledger

      - name: Sandbox log
        if: failure()
        run: tail -50 .localnet-sandbox.log
